<navbar/>
<div class="mt-14">
  <form class="w-full max-w-sm">
    <div class="md:flex md:items-center mb-6">
      <div class="md:w-1/3">
        <label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="inline-full-name">
          Nombre
        </label>
      </div>
      <div class="md:w-2/3">
        <input class="bg-gray-200 appearance-none border-2 border-gray-200 rounded w-full py-2 px-4 text-gray-700
                      leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
              id="inline-full-name"
              type="text"
              placeholder="Nombre del personaje"
              #nombreInput>
      </div>
    </div>
    <div class="md:flex md:items-center mb-6">
      <div class="md:w-1/3">
        <label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="inline-password">
          Daño
        </label>
      </div>
      <div class="md:w-2/3">
        <input class="bg-gray-200 appearance-none border-2 border-gray-200 rounded w-full py-2 px-4 text-gray-700
                      leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
               #poderInput>
      </div>
    </div>
    <div class="md:flex md:items-center mb-6">
      <div class="md:w-1/3">
        <label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="inline-password">
          Vida
        </label>
      </div>
      <div class="md:w-2/3">
        <input class="bg-gray-200 appearance-none border-2 border-gray-200 rounded w-full py-2 px-4 text-gray-700
                      leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
               #vidaInput>
      </div>
    </div>
    <div class="md:flex md:items-center mb-6">
      <div class="md:w-1/3">
        <label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="inline-password">
          ¿Puede esquivar?
        </label>
      </div>
      <div class="md:w-2/3">
        <input class="bg-gray-200 appearance-none border-2 border-gray-200 rounded w-full py-2 px-4 text-gray-700
                      leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
               placeholder="0 no esquiva, 1 lo esquiva todo "
               #esquivaInput>
      </div>
    </div>

    <div class="md:flex md:items-center mb-6">
      <div class="md:w-1/3">
        <label class="block text-gray-500 font-bold md:text-right mb-1 md:mb-0 pr-4" for="inline-password">
          Alineamiento
        </label>
      </div>
      <div class="md:w-2/3">
        <select class="bg-gray-200 appearance-none border-2 border-gray-200 rounded w-full py-2 px-4 text-gray-700
                      leading-tight focus:outline-none focus:bg-white focus:border-purple-500"
               placeholder="0 no esquiva, 1 lo esquiva todo "
               #alineamientoInput>

               <option>Bien</option>
               <option>Mal</option>
        </select>
      </div>
    </div>

    <div class="md:flex md:items-center">
      <div class="md:w-1/3"></div>
      <div class="md:w-2/3">
        <button class="btn-elvish font-elvish font-light italic text-yellow-100" type="button"
                (click)="addCharacter(nombreInput.value, poderInput.value, vidaInput.value, esquivaInput.value, alineamientoInput.value)">
          Añadir
        </button>
      </div>
    </div>

    @if (showConfirmationMessage) {
    <div class="md:flex md:items-center mt-4">
        <div class="md:w-1/3"></div>
        <div class="md:w-2/3">
            <p class="text-green-400 font-semibold italic">
                ¡Personaje añadido con éxito!
            </p>
        </div>
    </div>
    }
  </form>
</div>
